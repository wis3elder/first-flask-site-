volumes:
  postgres_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
     - postgres_data:/var/lib/postgresql/data
    ports:
      - "54367:5432"
  flask:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: flask
    volumes:
      - ./app/static/upload:/app/app/static/upload
      - ./.env:/app/.env
    env_file:
      - .env
    depends_on:
      - postgres
    expose:
      - 8000
  nginx:
    build:
      context: ./nginx/
      dockerfile: ./Dockerfile
    container_name: nginx
    env_file:
      - .env
    depends_on:
      - flask
    ports:
      - "8080:80"
